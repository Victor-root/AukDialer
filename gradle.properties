# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
ksp.incremental=false
# AGP 9 ships its own Kotlin support and a new DSL, and the two of them close
# a door on each other here: KSP refuses to run against built-in Kotlin, and the
# standalone Kotlin plugin KSP needs refuses to run against the new DSL. Room and
# the navigation graph are both generated by KSP, so it stays and the two AGP 9
# defaults are turned off until KSP catches up. Both flags are the migration path
# Google and JetBrains document, not a workaround of our own.
android.builtInKotlin=false
android.newDsl=false

# AGP repeats, on every build, that the two flags above are deprecated and that
# the Kotlin plugin calls the old variant API. Both are the same fact stated
# five times, it is already explained here, and nothing in this project can act
# on it until KSP works with built-in Kotlin. Silencing them is deliberate, and
# only these two categories are silenced, so a genuinely new warning still shows.
#
# The deadline is real: AGP 10 removes the flags outright. Whoever gets there
# first, a KSP release that speaks built-in Kotlin or AGP 10, this whole block
# and the two flags above come out together.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
