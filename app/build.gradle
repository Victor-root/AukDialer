plugins {
    id 'com.android.application' version '9.4.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
    id 'com.google.devtools.ksp' version '2.3.11'
}

// versionCode is what Android compares to decide whether an APK is an upgrade,
// so it only ever goes up. It restarts at 1 here because the application id
// changed: to a device this is a new app, not an update of the old one.
def baseVersionCode = 1
def buildNumber = (System.getenv("BUILD_NUMBER") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "0") as int
def isPreviewBuild = System.getenv("PREVIEW_BUILD") == "true"
def baseVersionName = "1.0"

// Signing details come from keystore.properties when building locally and from
// the environment on CI. The file is untracked because it holds passwords, so
// see keystore.properties.example for the keys it expects.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStorePath = keystoreProperties['storeFile'] ?: System.getenv("KEYSTORE_PATH")
def hasReleaseKey = releaseStorePath != null && file(releaseStorePath).exists()

// Say so out loud when a key is configured but missing. Otherwise the release
// build just comes out unsigned and the reason is nowhere to be seen. On
// Windows, a backslash path is the usual culprit: .properties files read them
// as escapes, so D:\Nextcloud arrives mangled. Use forward slashes.
if (releaseStorePath != null && !hasReleaseKey) {
    logger.warn("Signing key not found at '${releaseStorePath}'. The release build will be unsigned.")
}

android {
    namespace = 'auk.dialer.vroot'
    compileSdk = 36

    defaultConfig {
        applicationId = "auk.dialer.vroot"
        minSdk = 31
        targetSdk = 36
        versionCode = baseVersionCode + buildNumber
        versionName = isPreviewBuild ? "${baseVersionName}.${buildNumber}-preview" : baseVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    // Declared only when the key is really there. Declaring it empty still
    // creates the config, and AGP then fails the build on a signing config that
    // names no keystore rather than leaving the APK unsigned.
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile = file(releaseStorePath)
                storePassword = keystoreProperties['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD")
                keyAlias = keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS")
                keyPassword = keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            // Unsigned rather than signed with a throwaway key: an APK that
            // cannot be installed is obvious, one signed by the wrong key is
            // not, and it can no longer be upgraded by a properly signed build.
            signingConfig = hasReleaseKey ? signingConfigs.getByName('release') : null
            debuggable = false
        }
        debug {
            // Same key as release, so Run in Android Studio installs over an
            // existing release build instead of demanding an uninstall.
            signingConfig = hasReleaseKey ? signingConfigs.getByName('release') : signingConfigs.getByName('debug')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)

            freeCompilerArgs.addAll(
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi",
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
            )
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    splits {
        abi {
            enable = false
        }
    }
}

// The build type ends up in the name rather than being absent from the release
// one, because the only way to control the file name exactly is the old variant
// API: deprecated on AGP 8, removed in AGP 9, and with nothing public to replace
// it (the new VariantOutput carries no file name, and the class that does is
// internal). Taking the suffix is what buys a build with no deprecated API left
// in it and nothing to repair on the day of that upgrade.
base {
    archivesName = "AukDialer-${android.defaultConfig.versionName}"
}

// The release build otherwise ships an ART baseline profile, and Android Studio
// installs it alongside the APK as a separate .dm file. That extra install step
// is refused on some devices, and the whole deployment fails with
// INSTALL_BASELINE_PROFILE_FAILED even though the APK itself is fine, which
// makes Run unusable on the release variant.
//
// AGP offers no way to keep the profile inside the APK while skipping the .dm,
// so the profile goes. What it buys is a faster first launch after an install;
// ART rebuilds an equivalent profile from real usage within a few launches
// anyway, and this app is not distributed through a store that would use it.
tasks.configureEach { task ->
    if (task.name in ['compileReleaseArtProfile', 'expandReleaseArtProfileWildcards']) {
        task.enabled = false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha18'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    implementation 'io.github.raamcosta.compose-destinations:core:2.1.0'
    ksp 'io.github.raamcosta.compose-destinations:ksp:2.1.0'

    implementation "com.google.accompanist:accompanist-permissions:0.37.3"

    implementation platform("io.insert-koin:koin-bom:4.1.1")
    implementation "io.insert-koin:koin-android"
    implementation "io.insert-koin:koin-androidx-compose"

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
